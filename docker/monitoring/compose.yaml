# =============================================================================
# Monitoring stack: Airtel ODU usage -> Prometheus -> Grafana
#
#   odu-exporter  polls the Huawei ODU every 60s (local network only, no
#                 internet data used) and exposes metrics on :9877
#   felicity-exporter  reads the inverter locally (TCP/JSON, port 53970) every 15s
#   prometheus    stores the history (2 years by default)
#   grafana       dashboards, at https://grafana.<tailnet>.ts.net
#   uptime-kuma   service up/down checks + Telegram alerts, at https://status.<tailnet>.ts.net
#
# Usage (inside the "docker" LXC):
#   ./setup-env.sh            # creates .env (never committed)
#   docker compose up -d --build
# =============================================================================

name: monitoring

services:

  odu-exporter:
    build: ./odu-exporter
    image: local/odu-exporter:1.0
    container_name: odu-exporter
    environment:
      ODU_URL: ${ODU_URL}
      ODU_USERNAME: ${ODU_USERNAME:-admin}
      ODU_PASSWORD: ${ODU_PASSWORD}
      POLL_SECONDS: 60
      TZ: ${TZ}
    restart: unless-stopped

  felicity-exporter:
    build: ./felicity-exporter
    image: local/felicity-exporter:1.0
    container_name: felicity-exporter
    environment:
      INVERTER_HOST: ${INVERTER_HOST:-192.168.3.119}
      POLL_SECONDS: 15
      BATTERY_CAPACITY_WH: ${BATTERY_CAPACITY_WH:-5120}          # Felicity LPBF24200-M: 25.6 V x 200 Ah
      BATTERY_RESERVE_PERCENT: ${BATTERY_RESERVE_PERCENT:-20}    # inverter cut-off SOC
      INVERTER_OVERHEAD_W: ${INVERTER_OVERHEAD_W:-100}           # inverter self-consumption
      TARIFF_NGN_PER_KWH: ${TARIFF_NGN_PER_KWH:-209.50}          # EKEDC Band A, before VAT
      TARIFF_VAT_PERCENT: ${TARIFF_VAT_PERCENT:-7.5}
      INVERTER_RATED_W: ${INVERTER_RATED_W:-3000}                # IVEM3024
      BATTERY_NOMINAL_V: ${BATTERY_NOMINAL_V:-25.6}
      SYSTEM_COST_NGN: ${SYSTEM_COST_NGN:-3000000}
      GENERATOR_COST_NGN_PER_KWH: ${GENERATOR_COST_NGN_PER_KWH:-750}
      SOLAR_KWP: ${SOLAR_KWP:-2.2}                               # 4 x 550 W
      SITE_LAT: ${SITE_LAT:-6.50}                                # Surulere (approx.)
      SITE_LON: ${SITE_LON:-3.35}
      PANEL_TILT: ${PANEL_TILT:-10}
      PANEL_AZIMUTH: ${PANEL_AZIMUTH:-0}                         # 0 = south, -90 = east, 90 = west
      TZ: ${TZ}
    volumes:
      - felicity-state:/state            # running energy totals survive restarts
    ports:
      - 9878:9878                        # LAN: /json for Home Assistant
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-2y}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus      # named volume: avoids permission issues
    ports:
      - 9090:9090                        # LAN access for debugging
    depends_on:
      - odu-exporter
    restart: unless-stopped

  ts-grafana:
    image: tailscale/tailscale:stable
    hostname: grafana
    container_name: ts-grafana
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: grafana
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${CONFIG_ROOT}/tailscale/grafana:/var/lib/tailscale
      - ./tailscale/grafana.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 3000:3000                        # LAN access
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    network_mode: "service:ts-grafana"
    environment:
      TZ: ${TZ}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/home-internet.json
    volumes:
      - grafana-data:/var/lib/grafana    # named volume: avoids permission issues
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - ts-grafana
      - prometheus
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Uptime Kuma: checks every service each minute, alerts on Telegram,
  # at https://status.<tailnet>.ts.net
  # ---------------------------------------------------------------------------
  ts-status:
    image: tailscale/tailscale:stable
    hostname: status
    container_name: ts-status
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: status
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${CONFIG_ROOT}/tailscale/status:/var/lib/tailscale
      - ./tailscale/status.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 3001:3001                        # LAN access
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    network_mode: "service:ts-status"
    environment:
      TZ: ${TZ}
    volumes:
      - uptime-kuma-data:/app/data       # named volume: avoids permission issues
    depends_on:
      - ts-status
    restart: unless-stopped

volumes:
  felicity-state:
  prometheus-data:
  grafana-data:
  uptime-kuma-data:
