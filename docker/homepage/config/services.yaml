# Links use Tailscale addresses (work anywhere).
# Widgets talk to services over the LAN; keys come from homepage.secret.

- Watch & Listen:
    - Jellyfin:
        icon: jellyfin.svg
        href: https://jellyfin.tailc33d1b.ts.net
        siteMonitor: http://192.168.3.201:8096
        widget:
          type: jellyfin
          url: http://192.168.3.201:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          version: 2
          enableBlocks: true
          enableNowPlaying: true
