- Home & Internet:
    - Home Internet:
        icon: grafana.svg
        href: https://grafana.tailc33d1b.ts.net
        description: Airtel ODU usage
        widget:
          type: prometheusmetric
          url: http://192.168.3.201:9090
          refreshInterval: 60000
          metrics:
            - label: Used today
              query: odu_day_used_bytes
              format:
                type: bytes
            - label: Billing period
              query: odu_month_download_bytes + odu_month_upload_bytes
              format:
                type: bytes
            - label: Download now
              query: odu_download_rate_bytes * 8
              format:
                type: bits
    - Home Assistant:
        icon: home-assistant.svg
        href: http://192.168.3.202:8123
        siteMonitor: http://192.168.3.202:8123
        widget:
