- Home & Internet:
    - Home Internet:
        icon: grafana.svg
        href: https://grafana.tailc33d1b.ts.net
        description: Airtel ODU usage
        widget:
          type: prometheusmetric
          url: http://192.168.3.201:9090
          refreshInterval: 60000
          metrics:
            - label: Used today
              query: odu_day_used_bytes
              format:
                type: bytes
            - label: Billing period
              query: odu_month_download_bytes + odu_month_upload_bytes
              format:
                type: bytes
            - label: Download now
              query: odu_download_rate_bytes * 8
              format:
                type: bits
    - Home Power:
        icon: mdi-solar-power-variant
        href: https://grafana.tailc33d1b.ts.net/d/home-power
        description: Felicity inverter
        widget:
          type: prometheusmetric
          url: http://192.168.3.201:9090
          refreshInterval: 30000
          metrics:
            - label: Battery
              query: felicity_battery_soc_percent
              format:
                type: percent
            - label: Solar
              query: felicity_pv_power_watts
              format:
                type: number
                suffix: " W"
            - label: Load
              query: felicity_load_power_watts
              format:
                type: number
                suffix: " W"
            - label: Grid
              query: felicity_grid_voltage_volts
              format:
                type: number
                suffix: " V"
