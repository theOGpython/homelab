<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drawing Club">
<meta name="theme-color" content="#FFE680">
<title>Drawing Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sun: #FFE680;        /* page */
    --paper: #FFFFFF;      /* drawing surfaces */
    --ink: #26324A;        /* lines and text */
    --crayon: #FF6B1A;     /* the new step */
    --grass: #22A866;
    --sky: #2F8FEA;
    --berry: #F0507D;
    --pencil: #B9C2D3;     /* guides */
    --font: "Baloo 2", "Trebuchet MS", "Avenir Next Rounded", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font);
    font-size: 1.125rem;
    line-height: 1.45;
    color: var(--ink);
    background: var(--sun);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }
  .hidden { display: none !important; }

  /* ---------- shared pieces ---------- */
  .wrap { max-width: 1100px; margin: 0 auto; padding: 1rem 1.25rem 3rem; }
  .bar { display: flex; align-items: center; gap: .75rem; padding: .75rem 0 1rem; }
  .bar h1, .bar h2 { margin: 0; font-weight: 800; line-height: 1.1; }
  .bar h2 { font-size: 2rem; }
  .spacer { flex: 1; }
  .chip {
    border: 3px solid var(--ink); background: var(--paper); border-radius: 999px;
    padding: .35rem 1rem .25rem; font-weight: 700; box-shadow: 3px 3px 0 var(--ink); white-space: nowrap;
  }
  .chip:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .big {
    border: 3px solid var(--ink); border-radius: 22px; font-weight: 800; font-size: 1.5rem;
    padding: .7rem 1.4rem .55rem; box-shadow: 5px 5px 0 var(--ink); background: var(--paper);
    min-height: 64px;
  }
  .big:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
  .big:disabled { opacity: .35; box-shadow: none; cursor: default; transform: none; }
  .go { background: var(--grass); color: #fff; }
  .draw-it { background: var(--crayon); color: #fff; }

  /* ---------- home ---------- */
  .title {
    font-size: clamp(3rem, 9vw, 5.5rem); font-weight: 800; line-height: .95; margin: .5rem 0 0;
    letter-spacing: -0.01em;
  }
  .scribble { display: block; width: min(420px, 80%); height: 26px; margin: .25rem 0 1.25rem; }
  .scribble path { fill: none; stroke: var(--crayon); stroke-width: 7; stroke-linecap: round; }
  .intro { max-width: 34em; margin: 0 0 1.5rem; font-size: 1.25rem; }
  .home-actions { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 2.25rem; }
  .level { margin: 0 0 2.25rem; }
  .level h3 { font-size: 1.75rem; font-weight: 800; margin: 0 0 .75rem; display: flex; align-items: center; gap: .5rem; }
  .stars { color: var(--crayon); font-size: 1.4rem; letter-spacing: .1em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1.1rem; }
  .tile {
    background: var(--paper); border: 3px solid var(--ink); border-radius: 26px 22px 28px 20px;
    padding: .5rem .5rem .6rem; box-shadow: 5px 5px 0 var(--ink); text-align: center;
  }
  .tile:nth-child(3n+2) { border-radius: 20px 28px 22px 26px; }
  .tile:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
  .tile svg { width: 100%; aspect-ratio: 1; display: block; }
  .tile span { display: block; font-weight: 800; font-size: 1.35rem; }

  /* ---------- drawings (svg) ---------- */
  .art { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .art .dot { fill: var(--ink); stroke: none; }
  .art .scene { stroke: var(--grass); }
  .art .later { display: none; }
  .art .now { stroke: var(--crayon); stroke-width: 7; }
  .art .now.dot { fill: var(--crayon); }
  .art .now:not(.dot) { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .9s ease-out forwards; }
  .art .now.dot { transform-box: fill-box; transform-origin: center; animation: pop .45s ease-out both; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  .guide { fill: none; stroke: var(--pencil); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; opacity: .8; }
  .guide .dot { fill: var(--pencil); stroke: none; }

  /* ---------- lesson ---------- */
  .lesson { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 1.5rem; align-items: start; }
  .stage {
    background: var(--paper); border: 4px solid var(--ink); border-radius: 30px; box-shadow: 7px 7px 0 var(--ink);
    aspect-ratio: 1; display: grid; place-items: center; padding: 4%;
  }
  .stage svg { width: 100%; height: 100%; }
  .coach { display: flex; flex-direction: column; gap: 1.1rem; }
  .step-count { font-weight: 700; font-size: 1.2rem; margin: 0; }
  .say { font-size: clamp(1.7rem, 3.4vw, 2.4rem); font-weight: 800; line-height: 1.15; margin: 0; min-height: 3.5em; }
  .dots { display: flex; flex-wrap: wrap; gap: .45rem; }
  .dots i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); }
  .dots i.done { background: var(--ink); }
  .dots i.here { background: var(--crayon); border-color: var(--crayon); }
  .nav { display: flex; gap: 1rem; }
  .nav .big { flex: 1; }
  .idea {
    margin: .25rem 0 0; padding: .9rem 1.1rem; background: var(--paper); border: 3px dashed var(--ink);
    border-radius: 18px; font-size: 1.25rem;
  }

  /* ---------- drawing ---------- */
  .canvas-box {
    position: relative; background: var(--paper); border: 4px solid var(--ink); border-radius: 26px;
    box-shadow: 7px 7px 0 var(--ink); aspect-ratio: 1; width: min(100%, calc(100vh - 260px)); margin: 0 auto; overflow: hidden;
  }
  .canvas-box svg, .canvas-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .canvas-box svg { padding: 4%; }
  .canvas-box canvas { touch-action: none; cursor: crosshair; }
  .tools {
    display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: center;
    max-width: 900px; margin: 1.1rem auto 0;
  }
  .crayon {
    width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); background: var(--c);
    box-shadow: 3px 3px 0 var(--ink);
  }
  .crayon[aria-pressed="true"] { outline: 4px solid var(--ink); outline-offset: 3px; }
  .tool[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .sizes { display: flex; gap: .4rem; }
  .size { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); display: grid; place-items: center; box-shadow: 3px 3px 0 var(--ink); }
  .size b { display: block; border-radius: 50%; background: var(--ink); }
  .size[aria-pressed="true"] { background: var(--sun); }
  .chip.save { background: var(--grass); color: #fff; font-size: 1.2rem; padding: .45rem 1.3rem .35rem; }
  .chip:disabled { opacity: .5; }

  /* ---------- gallery ---------- */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 1.25rem; }
  .frame { background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; padding: .6rem; box-shadow: 5px 5px 0 var(--ink); }
  .frame img { width: 100%; aspect-ratio: 1; display: block; border-radius: 10px; background: #fff; cursor: zoom-in; }
  .frame p { margin: .4rem .2rem 0; display: flex; justify-content: space-between; align-items: center; gap: .5rem; font-weight: 700; }
  .frame small { font-weight: 500; opacity: .75; }
  .trash { border: none; background: none; font-size: 1.3rem; padding: .2rem .4rem; border-radius: 8px; }
  .empty { font-size: 1.4rem; max-width: 26em; }
  dialog { border: 4px solid var(--ink); border-radius: 24px; padding: .75rem; max-width: min(92vw, 720px); }
  dialog::backdrop { background: rgba(38, 50, 74, .6); }
  dialog img { width: 100%; display: block; border-radius: 12px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(1.5rem + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: .6rem 1.3rem .5rem; border-radius: 999px; font-weight: 800; z-index: 10;
  }

  @media (max-width: 760px) {
    .lesson { grid-template-columns: 1fr; }
    .say { min-height: 0; }
    .bar h2 { font-size: 1.6rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .art .now:not(.dot), .art .now.dot { animation: none; stroke-dashoffset: 0; }
  }
</style>
</head>
<body>

<!-- HOME -->
<main id="home" class="wrap">
  <h1 class="title">Drawing Club</h1>
  <svg class="scribble" viewBox="0 0 420 26" aria-hidden="true"><path d="M6 16 C 60 4, 110 24, 170 12 S 280 6, 330 16 S 400 18, 414 9"/></svg>
  <p class="intro">Every animal starts with simple shapes. Pick one, follow the steps, then draw it yourself.</p>
  <div class="home-actions">
    <button class="big draw-it" data-go="#/draw/free">Free drawing</button>
    <button class="big" data-go="#/gallery">My drawings</button>
  </div>
  <div id="levels"></div>
</main>

<!-- LESSON -->
<main id="lesson" class="wrap hidden">
  <div class="bar">
    <button class="chip" data-go="#/">All animals</button>
    <h2 id="lesson-name"></h2>
  </div>
  <div class="lesson">
    <div class="stage"><svg id="lesson-art" class="art" viewBox="0 0 300 300" role="img"></svg></div>
    <div class="coach">
      <p class="step-count" id="step-count"></p>
      <p class="say" id="step-say" aria-live="polite"></p>
      <div class="dots" id="step-dots" aria-hidden="true"></div>
      <div class="nav">
        <button class="big" id="prev">Back</button>
        <button class="big go" id="next">Next step</button>
      </div>
      <button class="big draw-it" id="to-draw">Draw it myself</button>
      <p class="idea hidden" id="idea"></p>
    </div>
  </div>
</main>

<!-- DRAW -->
<main id="draw" class="wrap hidden">
  <div class="bar">
    <button class="chip" id="draw-back">Back</button>
    <h2 id="draw-name"></h2>
    <span class="spacer"></span>
    <button class="chip tool" id="guide-toggle" aria-pressed="true">Guide</button>
    <button class="chip save" id="save">Save</button>
  </div>
  <div class="canvas-box" id="canvas-box">
    <svg id="guide" class="guide" viewBox="0 0 300 300" aria-hidden="true"></svg>
    <canvas id="canvas" aria-label="Drawing area"></canvas>
  </div>
  <div class="tools" id="tools">
    <div id="crayons" style="display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center"></div>
    <div class="sizes" id="sizes"></div>
    <button class="chip tool" id="eraser" aria-pressed="false">Eraser</button>
    <button class="chip" id="undo">Undo</button>
    <button class="chip" id="clear">Start over</button>
  </div>
</main>

<!-- GALLERY -->
<main id="gallery" class="wrap hidden">
  <div class="bar">
    <button class="chip" data-go="#/">All animals</button>
    <h2>My drawings</h2>
  </div>
  <div class="gallery" id="gallery-grid"></div>
  <p class="empty hidden" id="gallery-empty">No drawings yet. Pick an animal, draw it, and press "Save" to keep it here.</p>
</main>

<dialog id="viewer"><img id="viewer-img" alt=""></dialog>
<div class="toast hidden" id="toast" role="status"></div>

const BY_ID = Object.fromEntries(ANIMALS.map(a => [a.id, a]));
const withArticle = name => (/^[aeiou]/i.test(name) ? 'an ' : 'a ') + name.toLowerCase();
const nameOf = id => (BY_ID[id] ? BY_ID[id].name : 'Free drawing');

/* Build SVG markup for an animal up to step `upto` (inclusive); step `upto` is highlighted. */
function artMarkup(animal, upto = animal.steps.length - 1, highlight = false) {
  return animal.steps.map(([, shapes], i) => {
    const state = i < upto || (i === upto && !highlight) ? 'done' : i === upto ? 'now' : 'later';
    return `<g class="${state}">${shapes}</g>`;
  }).join('');
}

/* ---------------- views and routing ---------------- */
const $ = id => document.getElementById(id);
const views = ['home', 'lesson', 'draw', 'gallery'];
function show(view) {
  views.forEach(v => $(v).classList.toggle('hidden', v !== view));
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go]');
  if (t) location.hash = t.dataset.go;
});

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.add('hidden'), 2200);
}

/* ---------------- home ---------------- */
function renderHome() {
  $('levels').innerHTML = LEVELS.map(level => `
    <section class="level">
      <h3>${level.name} <span class="stars" aria-label="${level.stars} of 3 stars">${'★'.repeat(level.stars)}</span></h3>
      <div class="grid">
        ${ANIMALS.filter(a => a.level === level.id).map(a => `
          <button class="tile" data-go="#/learn/${a.id}">
            <svg class="art" viewBox="0 0 300 300" aria-hidden="true">${artMarkup(a)}</svg>
            <span>${a.name}</span>
          </button>`).join('')}
      </div>
    </section>`).join('');
  show('home');
}

/* ---------------- lesson ---------------- */
let lesson = { animal: null, step: 0 };
function renderLesson() {
  const { animal, step } = lesson;
  const total = animal.steps.length;
  $('lesson-name').textContent = `How to draw ${withArticle(animal.name)}`;
  $('lesson-art').setAttribute('aria-label', `${animal.name}, step ${step + 1}`);
  $('lesson-art').innerHTML = artMarkup(animal, step, true);
  $('step-count').textContent = `Step ${step + 1} of ${total}`;
  $('step-say').textContent = animal.steps[step][0];
  $('step-dots').innerHTML = animal.steps.map((_, i) => `<i class="${i < step ? 'done' : i === step ? 'here' : ''}"></i>`).join('');
  $('prev').disabled = step === 0;
  const last = step === total - 1;
  $('next').textContent = last ? 'All done!' : 'Next step';
  $('next').disabled = last;
  $('idea').textContent = animal.idea;
  $('idea').classList.toggle('hidden', !last);
}
$('prev').onclick = () => { if (lesson.step > 0) { lesson.step--; renderLesson(); } };
$('next').onclick = () => { if (lesson.step < lesson.animal.steps.length - 1) { lesson.step++; renderLesson(); } };
$('to-draw').onclick = () => { location.hash = `#/draw/${lesson.animal.id}`; };

/* ---------------- drawing ---------------- */
const CRAYONS = ['#26324A', '#FF6B1A', '#F0507D', '#FFC531', '#22A866', '#2F8FEA', '#8E5BD8', '#8B5A2B'];
const SIZES = [6, 12, 22];
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
let pen = { color: CRAYONS[0], size: 1, eraser: false };
let strokes = [];          // {color, size, eraser, pts: [[x,y],...]} with coordinates 0..1
let current = null;
let drawingAnimal = 'free';

function paint(context, px, list) {
  context.clearRect(0, 0, px, px);
  context.lineCap = 'round';
  context.lineJoin = 'round';
  for (const s of list) {
    context.globalCompositeOperation = s.eraser ? 'destination-out' : 'source-over';
    context.strokeStyle = s.color;
    context.fillStyle = s.color;
    context.lineWidth = SIZES[s.size] * px / 600;
    if (s.pts.length === 1) {
      const [x, y] = s.pts[0];
      context.beginPath();
      context.arc(x * px, y * px, context.lineWidth / 2, 0, Math.PI * 2);
      context.fill();
      continue;
    }
    context.beginPath();
    context.moveTo(s.pts[0][0] * px, s.pts[0][1] * px);
    for (let i = 1; i < s.pts.length - 1; i++) {
      const [x1, y1] = s.pts[i], [x2, y2] = s.pts[i + 1];
      context.quadraticCurveTo(x1 * px, y1 * px, (x1 + x2) / 2 * px, (y1 + y2) / 2 * px);
    }
    const end = s.pts[s.pts.length - 1];
    context.lineTo(end[0] * px, end[1] * px);
    context.stroke();
  }
  context.globalCompositeOperation = 'source-over';
}
function resizeCanvas() {
  const px = Math.round(canvas.clientWidth * (window.devicePixelRatio || 1));
  if (px && canvas.width !== px) { canvas.width = canvas.height = px; }
  paint(ctx, canvas.width, strokes);
}
function point(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
}
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  current = { color: pen.color, size: pen.size, eraser: pen.eraser, pts: [point(e)] };
  strokes.push(current);
  paint(ctx, canvas.width, strokes);
});
canvas.addEventListener('pointermove', e => {
  if (!current) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of evs) current.pts.push(point(ev));
  paint(ctx, canvas.width, strokes);
});
const endStroke = () => { current = null; };
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);
window.addEventListener('resize', () => { if (!$('draw').classList.contains('hidden')) resizeCanvas(); });

function renderTools() {
  $('crayons').innerHTML = CRAYONS.map(c =>
    `<button class="crayon" style="--c:${c}" aria-label="Crayon colour ${c}" aria-pressed="${!pen.eraser && pen.color === c}" data-color="${c}"></button>`).join('');
  $('sizes').innerHTML = SIZES.map((s, i) =>
    `<button class="size" aria-label="${['Thin', 'Medium', 'Thick'][i]} line" aria-pressed="${pen.size === i}" data-size="${i}"><b style="width:${s}px;height:${s}px"></b></button>`).join('');
  $('eraser').setAttribute('aria-pressed', pen.eraser);
}
$('crayons').onclick = e => { const b = e.target.closest('[data-color]'); if (b) { pen.color = b.dataset.color; pen.eraser = false; renderTools(); } };
$('sizes').onclick = e => { const b = e.target.closest('[data-size]'); if (b) { pen.size = +b.dataset.size; renderTools(); } };
$('eraser').onclick = () => { pen.eraser = !pen.eraser; renderTools(); };
$('undo').onclick = () => { strokes.pop(); paint(ctx, canvas.width, strokes); };
$('clear').onclick = () => {
  if (strokes.length && confirm('Start over? This clears your drawing.')) { strokes = []; paint(ctx, canvas.width, strokes); }
};
$('guide-toggle').onclick = () => {
  const on = $('guide-toggle').getAttribute('aria-pressed') !== 'true';
  $('guide-toggle').setAttribute('aria-pressed', on);
  $('guide').classList.toggle('hidden', !on);
};
$('draw-back').onclick = () => { history.length > 1 ? history.back() : (location.hash = '#/'); };

function renderDraw(id) {
  drawingAnimal = BY_ID[id] ? id : 'free';
  const animal = BY_ID[drawingAnimal];
  $('draw-name').textContent = animal ? `Draw ${withArticle(animal.name)}` : 'Free drawing';
  $('guide').innerHTML = animal ? artMarkup(animal) : '';
  $('guide-toggle').classList.toggle('hidden', !animal);
  $('guide-toggle').setAttribute('aria-pressed', 'true');
  $('guide').classList.toggle('hidden', !animal);
  strokes = [];
  renderTools();
  show('draw');
  requestAnimationFrame(resizeCanvas);
}

$('save').onclick = async () => {
  if (!strokes.length) { toast('Draw something first!'); return; }
  const px = 1024;
  const layer = document.createElement('canvas');
  layer.width = layer.height = px;
  paint(layer.getContext('2d'), px, strokes);
  const out = document.createElement('canvas');
  out.width = out.height = px;
  const o = out.getContext('2d');
  o.fillStyle = '#FFFFFF';
  o.fillRect(0, 0, px, px);
  o.drawImage(layer, 0, 0);
  $('save').disabled = true;
  try {
    const res = await fetch('/api/drawings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ animal: drawingAnimal, image: out.toDataURL('image/png') }),
    });
    if (!res.ok) throw new Error((await res.json()).error || 'Save failed');
    toast('Saved to my drawings!');
  } catch (err) {
    toast(`Couldn't save: ${err.message}. Check the server is running.`);
  } finally {
    $('save').disabled = false;
  }
};

/* ---------------- gallery ---------------- */
async function renderGallery() {
  show('gallery');
  const grid = $('gallery-grid');
  grid.innerHTML = '';
  let items = [];
  try {
    items = await (await fetch('/api/drawings')).json();
  } catch {
    grid.innerHTML = '<p class="empty">Couldn\'t load drawings. Check the server is running, then reload.</p>';
    return;
  }
  $('gallery-empty').classList.toggle('hidden', items.length > 0);
  grid.innerHTML = items.map(d => {
    const when = new Date(d.created).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    return `<figure class="frame" style="margin:0">
      <img src="${d.url}" alt="${nameOf(d.animal)} drawing from ${when}" loading="lazy" data-view="${d.url}">
      <p><span>${nameOf(d.animal)}<br><small>${when}</small></span>
      <button class="trash" aria-label="Delete this drawing" data-delete="${d.file}">🗑️</button></p>
    </figure>`;
  }).join('');
}
$('gallery-grid').onclick = async e => {
  const del = e.target.closest('[data-delete]');
  if (del) {
    if (!confirm('Delete this drawing? This can\'t be undone.')) return;
    const res = await fetch(`/api/drawings/${del.dataset.delete}`, { method: 'DELETE' });
    toast(res.ok ? 'Drawing deleted' : 'Couldn\'t delete that drawing');
    renderGallery();
    return;
  }
  const img = e.target.closest('[data-view]');
  if (img) { $('viewer-img').src = img.dataset.view; $('viewer-img').alt = img.alt; $('viewer').showModal(); }
};
$('viewer').onclick = () => $('viewer').close();

/* ---------------- router ---------------- */
function route() {
  const [, view, id] = (location.hash || '#/').split('/');
  if (view === 'learn' && BY_ID[id]) { lesson = { animal: BY_ID[id], step: 0 }; renderLesson(); show('lesson'); }
  else if (view === 'draw') renderDraw(id);
  else if (view === 'gallery') renderGallery();
  else renderHome();
}
window.addEventListener('hashchange', route);
route();
</script>
