# =============================================================================
# n8n: workflow automation, at https://n8n.<tailnet>.ts.net
#
#   n8n        the app (data in a named volume, so no permission issues)
#   postgres   n8n's database (more robust than the default SQLite)
#   ts-n8n     Tailscale sidecar: private HTTPS access from your devices
#
# Usage (inside the "docker" LXC):
#   bash setup-env.sh          # creates .env (never committed)
#   docker compose up -d
# =============================================================================

name: n8n

services:

  postgres:
    image: postgres:16
    container_name: n8n-postgres
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ts-n8n:
    image: tailscale/tailscale:stable
    hostname: n8n
    container_name: ts-n8n
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: n8n
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${CONFIG_ROOT}/tailscale/n8n:/var/lib/tailscale
      - ./tailscale/n8n.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 5678:5678                       # LAN access
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    network_mode: "service:ts-n8n"
    environment:
      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Encrypts saved credentials. BACK THIS UP: without it, saved credentials are unrecoverable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # URLs (so links and webhook URLs use the Tailscale HTTPS address)
      N8N_HOST: n8n.${TS_TAILNET}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://n8n.${TS_TAILNET}/
      N8N_EDITOR_BASE_URL: https://n8n.${TS_TAILNET}/
      # Housekeeping
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336         # keep 14 days of run history
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      ts-n8n:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  n8n-data:
