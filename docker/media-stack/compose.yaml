# =============================================================================
# Media stack — Jellyfin + download automation behind a VPN.
# Every web UI is also reachable privately over Tailscale with HTTPS
# (https://<name>.<your-tailnet>.ts.net), using Tailscale "sidecar" containers.
#
# Adapted from:
#   - LifeofDan-EL/homelab  docker/media-stack/docker-compose.yaml
#   - Tailscale's Docker sidecar pattern (tailscale-dev/video-code-snippets)
#
# Usage (inside the "docker" LXC):
#   cp .env.example .env && nano .env      # fill in values — never commit .env
#   docker compose up -d
# =============================================================================

name: media

# ----- Shared building blocks -------------------------------------------------

x-common-env: &common-env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

x-ts-env: &ts-env
  TS_AUTHKEY: ${TS_AUTHKEY}
  TS_STATE_DIR: /var/lib/tailscale
  TS_USERSPACE: "false"
  TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}

x-ts-base: &ts-base
  image: tailscale/tailscale:stable
  devices:
    - /dev/net/tun:/dev/net/tun
  cap_add:
    - NET_ADMIN
  restart: unless-stopped

x-behind-vpn: &behind-vpn
  network_mode: "service:gluetun"
  depends_on:
    gluetun:
      condition: service_healthy
  restart: unless-stopped

services:

  # ===========================================================================
  # VPN gateway — all download/indexer traffic leaves through this container.
  # If the VPN drops, these apps lose internet instead of leaking your real IP.
  # ===========================================================================
  gluetun:
    image: qmcgaw/gluetun:v3.41
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: ${VPN_TYPE}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      # Let apps behind the VPN still reach devices on the home LAN
      FIREWALL_OUTBOUND_SUBNETS: ${LAN_SUBNET}
    volumes:
      - ${CONFIG_ROOT}/gluetun:/gluetun
    ports:                     # LAN access to the apps that live inside gluetun
      - 8080:8080              # qBittorrent
      - 9696:9696              # Prowlarr
      - 8989:8989              # Sonarr
      - 7878:7878              # Radarr
      - 6767:6767              # Bazarr
    restart: unless-stopped

  # ----- Apps that share gluetun's network (reach each other via localhost) ---

  qbittorrent:
    <<: *behind-vpn
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${DATA_ROOT}:/data

  prowlarr:
    <<: *behind-vpn
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config

  flaresolverr:
    <<: *behind-vpn
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      LOG_LEVEL: info
      TZ: ${TZ}

  sonarr:
    <<: *behind-vpn
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data

  radarr:
    <<: *behind-vpn
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data

  bazarr:
    <<: *behind-vpn
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${DATA_ROOT}:/data

  # Tailscale entry point for everything inside gluetun.
  # Each app gets its own HTTPS port on https://arr.<tailnet>.ts.net:<port>
  ts-arr:
    <<: *ts-base
    hostname: arr
    container_name: ts-arr
    environment:
      <<: *ts-env
      TS_HOSTNAME: arr
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${CONFIG_ROOT}/tailscale/arr:/var/lib/tailscale
      - ./tailscale/arr.json:/config/serve.json:ro
    depends_on:
      - gluetun

  # ===========================================================================
  # Jellyfin — the media server (NOT behind the VPN; streams on LAN + tailnet)
  # ===========================================================================
  ts-jellyfin:
    <<: *ts-base
    hostname: jellyfin
    container_name: ts-jellyfin
    environment:
      <<: *ts-env
      TS_HOSTNAME: jellyfin
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${CONFIG_ROOT}/tailscale/jellyfin:/var/lib/tailscale
      - ./tailscale/jellyfin.json:/config/serve.json:ro
    ports:
      - 8096:8096              # LAN access (TVs, phones at home)

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    network_mode: "service:ts-jellyfin"
    user: ${PUID}:${PGID}
    group_add:
      - "${RENDER_GID}"        # lets Jellyfin use the Intel iGPU for transcoding
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      TZ: ${TZ}
    volumes:
      - ${CONFIG_ROOT}/jellyfin/config:/config
      - ${CONFIG_ROOT}/jellyfin/cache:/cache
      - ${DATA_ROOT}/media:/data/media:ro
    depends_on:
      - ts-jellyfin
    restart: unless-stopped

  # ===========================================================================
  # Seerr — request page for the family ("I want to watch X")
  # ===========================================================================
  ts-seerr:
    <<: *ts-base
    hostname: requests
    container_name: ts-seerr
    environment:
      <<: *ts-env
      TS_HOSTNAME: requests
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${CONFIG_ROOT}/tailscale/seerr:/var/lib/tailscale
      - ./tailscale/seerr.json:/config/serve.json:ro
    ports:
      - 5055:5055

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    network_mode: "service:ts-seerr"
    environment:
      LOG_LEVEL: info
      TZ: ${TZ}
    volumes:
      - ${CONFIG_ROOT}/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    depends_on:
      - ts-seerr
      - gluetun
    restart: unless-stopped

  # ===========================================================================
  # Audiobookshelf — audiobooks, stories and podcasts
  # ===========================================================================
  ts-books:
    <<: *ts-base
    hostname: books
    container_name: ts-books
    environment:
      <<: *ts-env
      TS_HOSTNAME: books
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${CONFIG_ROOT}/tailscale/books:/var/lib/tailscale
      - ./tailscale/books.json:/config/serve.json:ro
    ports:
      - 13378:13378

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    network_mode: "service:ts-books"
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
      PORT: 13378              # non-root can't bind port 80, so use 13378
    volumes:
      - ${CONFIG_ROOT}/audiobookshelf/config:/config
      - ${CONFIG_ROOT}/audiobookshelf/metadata:/metadata
      - ${DATA_ROOT}/media/audiobooks:/audiobooks
      - ${DATA_ROOT}/media/podcasts:/podcasts
    depends_on:
      - ts-books
    restart: unless-stopped
