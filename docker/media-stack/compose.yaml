# =============================================================================
# Media stack: Jellyfin + download automation, every web UI also reachable
# privately over Tailscale (https://<name>.<tailnet>.ts.net) via sidecars.
#
# VPN: OFF by default. Apps talk to each other by container name.
#      To route qBittorrent through the VPN later, add to .env:
#        COMPOSE_FILE=compose.yaml:compose.vpn.yaml
#      plus your VPN credentials, then run: docker compose up -d
#      (see compose.vpn.yaml; no app settings need to change)
#
# Adapted from:
#   - LifeofDan-EL/homelab  docker/media-stack/docker-compose.yaml
#   - Tailscale's Docker sidecar pattern (tailscale-dev/video-code-snippets)
# =============================================================================

name: media

x-common-env: &common-env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

x-ts-env: &ts-env
  TS_AUTHKEY: ${TS_AUTHKEY}
  TS_STATE_DIR: /var/lib/tailscale
  TS_USERSPACE: "false"
  TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}

x-ts-base: &ts-base
  image: tailscale/tailscale:stable
  devices:
    - /dev/net/tun:/dev/net/tun
  cap_add:
    - NET_ADMIN
  restart: unless-stopped

services:

  # ===========================================================================
  # Download automation
  # ===========================================================================
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${DATA_ROOT}:/data
    ports:
      - 8080:8080
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      LOG_LEVEL: info
      TZ: ${TZ}
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - 6767:6767
    restart: unless-stopped

  # Tailscale entry point for the download apps:
  # https://arr.<tailnet>.ts.net:<port> for each app
  ts-arr:
    <<: *ts-base
    hostname: arr
    container_name: ts-arr
    environment:
      <<: *ts-env
      TS_HOSTNAME: arr
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${CONFIG_ROOT}/tailscale/arr:/var/lib/tailscale
      - ./tailscale/arr.json:/config/serve.json:ro

  # ===========================================================================
  # Jellyfin: the media server
  # ===========================================================================
  ts-jellyfin:
    <<: *ts-base
    hostname: jellyfin
    container_name: ts-jellyfin
    environment:
      <<: *ts-env
      TS_HOSTNAME: jellyfin
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${CONFIG_ROOT}/tailscale/jellyfin:/var/lib/tailscale
      - ./tailscale/jellyfin.json:/config/serve.json:ro
    ports:
      - 8096:8096

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    network_mode: "service:ts-jellyfin"
    user: ${PUID}:${PGID}
    group_add:
      - "${RENDER_GID}"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      TZ: ${TZ}
    volumes:
      - ${CONFIG_ROOT}/jellyfin/config:/config
      - ${CONFIG_ROOT}/jellyfin/cache:/cache
      - ${DATA_ROOT}/media:/data/media:ro
    depends_on:
      - ts-jellyfin
    restart: unless-stopped

  # ===========================================================================
  # Seerr: family request page
  # ===========================================================================
  ts-seerr:
    <<: *ts-base
    hostname: requests
    container_name: ts-seerr
    environment:
      <<: *ts-env
      TS_HOSTNAME: requests
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${CONFIG_ROOT}/tailscale/seerr:/var/lib/tailscale
      - ./tailscale/seerr.json:/config/serve.json:ro
    ports:
      - 5055:5055

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    network_mode: "service:ts-seerr"
    environment:
      LOG_LEVEL: info
      TZ: ${TZ}
    volumes:
      - ${CONFIG_ROOT}/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    depends_on:
      - ts-seerr
    restart: unless-stopped

  # ===========================================================================
  # Audiobookshelf
  # ===========================================================================
  ts-books:
    <<: *ts-base
    hostname: books
    container_name: ts-books
    environment:
      <<: *ts-env
      TS_HOSTNAME: books
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${CONFIG_ROOT}/tailscale/books:/var/lib/tailscale
      - ./tailscale/books.json:/config/serve.json:ro
    ports:
      - 13378:13378

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    network_mode: "service:ts-books"
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
      PORT: 13378
    volumes:
      - ${CONFIG_ROOT}/audiobookshelf/config:/config
      - ${CONFIG_ROOT}/audiobookshelf/metadata:/metadata
      - ${DATA_ROOT}/media/audiobooks:/audiobooks
      - ${DATA_ROOT}/media/podcasts:/podcasts
    depends_on:
      - ts-books
    restart: unless-stopped
